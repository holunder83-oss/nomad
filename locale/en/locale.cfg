[entity-description]
ncs-hard-drill=After the research "Tungsten with electric drills" it can also mine tungsten ore, but only at a tenth of the speed, and it slowly takes damage while doing so (breaks after about 20 minutes). Enough for your first big mining drills.
ncs-barrel-filler=Fills and empties barrels, nothing else. Allowed on planets from the start.
ncs-orbital-cannon=Bombards only the planet the ship is orbiting. Set targets with the orbital targeting remote (shortcut bar button). Takes orbital artillery shells (10 s reload) and robot shells (2 s), not normal artillery shells.
ncs-extractor=Stands on a deposit and picks the matching recipe by itself. A run only starts with the button in its window and takes 5 minutes. The result stays in the output until you collect it; only then can the next run start.
ncs-core=Rare deposit. Place a floor extractor exactly on top of it (3×3). The number is the count of remaining runs.
ncs-large-cargo-bay=Adds 100 inventory slots to the hub or landing pad.
ncs-tungsten-vein=Infinite tungsten deposit. Place a drill on top. Mining the vein removes the deposit and gives you the vein back.
ncs-calcite-vein=Infinite calcite deposit. Place a drill on top. Mining the vein removes the deposit and gives you the vein back.
ncs-oil-source=Infinite crude oil source. Place a pumpjack on top. Mining the source removes it and gives it back to you.
ncs-uranium-vein=Infinite uranium deposit. Place a drill on top (needs sulfuric acid). Mining the vein removes the deposit and gives you the vein back.
ncs-lithium-source=Infinite lithium brine. Place a pumpjack on top. Mining the source removes it and gives it back to you.
ncs-fluorine-source=Infinite fluorine vent. Place a pumpjack on top. Mining the source removes it and gives it back to you.
ncs-scrap-vein=Infinite scrap deposit. Place a drill on top. Mining the vein removes the deposit and gives you the vein back.
ncs-promethium-thruster=Stronger thruster for the heavy mothership. Burns promethium fuel instead of thruster fuel.
ncs-matter-recombinator=Upgrades the quality of individual items directly, without a recycling loop.\n\n[font=default-bold]How it works:[/font]\n• Insert any item (e.g. a building, module or weapon). It picks the recipe by itself, like a furnace.\n• After 10 seconds the same item comes out again. With a 25 % chance it is one quality tier better, rarely even more. Otherwise it stays the same, nothing is ever lost.\n• Legendary items cannot get any better.\n\n[font=default-bold]Operation:[/font]\n• Fuel: promethium cells. One cell lasts for 10 items.\n• The output has only one slot and different qualities don't stack: take results out with an inserter, otherwise it stops.\n• No modules, no beacons.\n• Only in space on promethium floor.
ncs-jump-drive=Jumps the ship directly to a discovered planet. Costs 50 promethium cells per jump. Promethium floor only.
ncs-orbital-agricultural-tower=Agricultural tower for the mothership. Only works in space on bio floor (yumako or jellynut). Yumako grows on the light green, jellynut on the magenta bio floor.
ncs-supply-capsule=Smaller than a rocket silo: blasts small payloads up to a ship in orbit. Launches on every planet using its resources: Nauvis coal + iron ore, Vulcanus lava + calcite, Gleba yumako + jellynut + stone, Fulgora scrap, Aquilo ammoniacal solution + lithium brine (ammonia horizontally left and right, brine vertically top and bottom, both pass through; the capsule cannot be rotated), elsewhere power only (slower). Once the rocket is ready, ticked ingredients fill the cargo hold and fly along. Takes you along too: board it like a rocket silo.

