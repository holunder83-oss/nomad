[item-description]
ncs-barrel-filler=Hardcore variant: fills and empties barrels, nothing else. Allowed on planets from the start, so fluids can go up to the ship.
ncs-orbital-cluster-shell=Orbital cannon only: after the impact on the target, 12 more orbital shells rain down within 25 tiles. Afterwards the cannon needs 30 seconds to reload.
ncs-orbital-artillery-shell=Shell for the orbital cannon only: blast radius 10 instead of 4 and more damage. Afterwards the cannon needs 10 seconds to reload.
ncs-distractor-artillery-shell=Releases 10 distractors on impact. They hunt for targets on their own until their time runs out. Also works in the orbital cannon.
ncs-defender-artillery-shell=Releases 10 defenders on impact. They hunt for targets on their own until their time runs out. Also works in the orbital cannon.
ncs-destroyer-artillery-shell=Releases 10 destroyers on impact. They hunt for targets on their own until their time runs out. Also works in the orbital cannon.
ncs-orbital-cannon=Artillery for your ship. Bombards the planet the ship is orbiting. Load it with orbital artillery shells or robot shells and aim with the orbital targeting remote (shortcut bar button).
ncs-orbital-targeting=In the map view of a planet: a click sets a target, a box marks every nest, worm and turret inside. Every orbital cannon on your ships in orbit of this planet fires at them. No range limit.
ncs-core-scanner=Hold it and click anywhere: an arrow points to the nearest deposit, and the chat lists the nearest one of each kind with distance and map link. No fixed range: it searches the whole planet, but only finds deposits in already explored areas (radars help). Every kind exists at least once on every planet within about 400 tiles of the map center.
ncs-unstable-scrap=Comes from the scrap avalanche of the floor extractor. Explodes after 45 seconds, even in chests and on belts (one explosion per full stack). Stabilize it in an assembling machine or put it straight into a recycler in time.
ncs-extractor=Pulls special floors and ship sources out of deposits on the planets. Place it on a deposit, insert ingredients, start a run. The result stays in the extractor until you collect it.
ncs-large-cargo-bay=Attaches to a hub or landing pad like a normal cargo bay, but adds 100 instead of 20 inventory slots.
ncs-tungsten-vein=Infinite tungsten ore for the ship. Place it on foundation and a deposit (3×3) for normal drills appears beneath it. Never runs out. Only obtainable from the floor extractor.
ncs-calcite-vein=Infinite calcite for the ship. Place it on foundation and a deposit (3×3) for normal drills appears beneath it. Never runs out. Only obtainable from the floor extractor.
ncs-oil-source=Infinite crude oil for the ship. Place it on foundation and put a pumpjack on top. Never runs out. Only obtainable from the floor extractor.
ncs-uranium-vein=Infinite uranium ore for the ship. Place it on foundation and a deposit (3×3) for normal drills appears beneath it (they need sulfuric acid). Never runs out. Only obtainable from the floor extractor.
ncs-living-metal-anywhere=Metal grown through with pentapod tissue that binds promethium. Grown in the biochamber. Base material for promethium cells.
ncs-ammonia-pool=Ammoniacal ocean in space. Placed like space platform foundation. A normal offshore pump at its edge pumps ammoniacal solution. Only obtainable from the floor extractor.
ncs-lithium-source=Infinite lithium brine for the ship. Place it on foundation and put a pumpjack on top. Never runs out. Only obtainable from the floor extractor.
ncs-fluorine-source=Infinite fluorine vent for the ship. Place it on foundation and put a pumpjack on top. Never runs out. Only obtainable from the floor extractor.
ncs-scrap-vein=Infinite scrap source for the ship. Place it on foundation and a scrap deposit (3×3) appears beneath it, which you mine with normal drills. It never runs out. Only obtainable from the floor extractor.
ncs-living-metal=Metal grown through with pentapod tissue that binds promethium. Only grown on Gleba in the biochamber. Base material for promethium cells.
ncs-promethium-cell=Fuel for the matter recombinator and the jump drive. Requires living metal from Gleba.
ncs-matter-recombinator=Upgrades the quality of individual items directly: 1 item in, the same item out, with a 25 % chance of one quality tier better. Nothing is ever lost. Runs on promethium cells (10 items per cell). Only in space on promethium floor.
ncs-suit-armor=Space suit variant: outside on the ship you hover over buildings with it. Turns back into the normal armor when you enter the hub.
ncs-supply-capsule=Smaller than a rocket silo: blasts small payloads up to a ship in orbit. Launches on every planet using its resources: Nauvis coal + iron ore, Vulcanus lava + calcite, Gleba yumako + jellynut + stone, Fulgora scrap, Aquilo ammoniacal solution + lithium brine (ammonia horizontally left and right, brine vertically top and bottom, both pass through; the capsule cannot be rotated), elsewhere power only (slower). Once the rocket is ready, ticked ingredients fill the cargo hold and fly along. Takes you along too: board it like a rocket silo.
ncs-lava-pool=Lava in space. Placed like space platform foundation. A normal offshore pump at its edge pumps lava, so the foundry works on the ship. Only obtainable from the floor extractor.
ncs-bio-foundation=Gleba soil for yumako in space. Placed like space platform foundation. Yumako trees grow here, planted by the orbital agricultural tower. Only obtainable from the floor extractor.
ncs-jellynut-foundation=Gleba soil for jellynut in space. Placed like space platform foundation. Jellystems grow here, planted by the orbital agricultural tower. Only obtainable from the floor extractor.
ncs-promethium-foundation=Placed like space platform foundation. The matter recombinator and the jump drive can only be built here. Expensive to make.

