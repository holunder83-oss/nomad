[technology-description]
ncs-tungsten-drilling=Electric mining drills may stand on tungsten ore. They mine it very slowly and take damage doing so, but it is enough for your first big mining drills.
ncs-nomad-achieved=The final research. After this, your mothership no longer needs a planet.
ncs-orbital-cluster-shell=Carpet bombing from orbit: 13 orbital shells in one shot, spread over 25 tiles around the target.
ncs-distractor-artillery-shell=An artillery shell that releases 10 distractors on impact. They fly to the nearest enemy on their own.
ncs-defender-artillery-shell=An artillery shell that releases 10 defenders on impact. They fly to the nearest enemy on their own.
ncs-destroyer-artillery-shell=An artillery shell that releases 10 destroyers on impact. They fly to the nearest enemy on their own.
ncs-orbital-cannon=Artillery from your ship: clear the nests around a deposit before you land.
ncs-extractor=A building for the planets that pulls special floors and ship sources out of rare deposits. Which deposits it may extract is unlocked by the research of each floor or source.
ncs-planet-factories=Variant A: Assembler 3, electric furnace, beacon and centrifuge may also be built on planets.
ncs-planet-industry=Variant A: Space Age factories (foundry, EM plant, biochamber, cryogenic plant, recycler …) may also be built on planets.
ncs-thruster-boost=All your ships travel faster between planets at the same fuel consumption. Applies right away.
ncs-recall-beam=Brings you and your whole inventory from a planet back into the hub of a ship in orbit, without a rocket silo. Button at the top left while you are on a planet; with several ships in orbit you choose one.
ncs-large-cargo-bay=A cargo bay with 100 instead of 20 slots, so the hub does not fill up with heavy traffic.
ncs-tungsten-vein=Vulcanus' tungsten for the ship: an infinite tungsten deposit that you place on foundation and mine with normal drills. Afterwards the floor extractor pulls it from deposits on the planet.
ncs-calcite-vein=Vulcanus' calcite for the ship: an infinite calcite deposit that you place on foundation and mine with normal drills. Afterwards the floor extractor pulls it from deposits on the planet.
ncs-oil-source=Crude oil for the ship: an infinite crude oil source that you place on foundation and pump with a pumpjack. Afterwards the floor extractor pulls it from deposits on the planet.
ncs-uranium-vein=Uranium for the ship: an infinite uranium deposit that you place on foundation and mine with normal drills. Afterwards the floor extractor pulls it from deposits on the planet.
ncs-rocket-capacity=Rocket silos and supply capsules carry more into space. Applies to all built silos right away (as soon as no rocket is waiting in the silo).
ncs-lithium-source=Aquilo's lithium for the ship: the lithium source is infinite lithium brine that you place on foundation and pump with a pumpjack. Afterwards the floor extractor pulls it from deposits on the planet.
ncs-fluorine-source=Aquilo's fluorine for the ship: the fluorine source is an infinite fluorine vent that you place on foundation and pump with a pumpjack. Afterwards the floor extractor pulls it from deposits on the planet.
ncs-ammonia-zone=Ammonia pool for the mothership: a normal offshore pump at its edge pumps ammoniacal solution. Afterwards the floor extractor pulls it from deposits on the planet.
ncs-scrap-vein=Fulgora's scrap for the ship: the scrap vein is an infinite scrap deposit that you place on foundation and mine with normal drills. Afterwards the floor extractor pulls it from deposits on the planet.
ncs-living-metal=Pentapod tissue binds promethium into metal. Living metal is grown on Gleba in the biochamber and is the base material for promethium cells.
ncs-living-metal-anywhere=Pentapod tissue binds promethium into metal. Living metal is grown in the biochamber and is the base material for promethium cells.
ncs-spacesuit=You can step out of the hub on your ships and walk around with your character, build and operate machines. In the suit you hover over buildings, but not over the edge into space. Only while the ship is in orbit.
ncs-spacesuit-flight=Carbon fiber reinforcement for the space suit: you can step out and stay outside while the ship is flying. Careful at the front edge: asteroids can kill you there.
ncs-promethium-drive=Promethium as fuel: promethium cells, promethium fuel and a stronger thruster for the heavy mothership.
ncs-promethium-zone=Promethium floor for the mothership. The matter recombinator and the jump drive can only be built on it.
ncs-lava-zone=Lava pool for the mothership: a normal offshore pump at its edge pumps lava, so the foundry works in space. The floor extractor pulls it from lava deposits on Vulcanus.
ncs-bio-zone=Light green bio floor for the mothership: yumako trees grow on it, planted by the orbital agricultural tower. The floor extractor pulls it from deposits on Gleba. Also unlocks the agricultural tower. Can be researched independently of the jellynut floor.
ncs-jellynut-zone=Magenta bio floor for the mothership: jellystems grow on it, planted by the orbital agricultural tower. The floor extractor pulls it from deposits on Gleba. Also unlocks the agricultural tower. Can be researched independently of the yumako floor.

