[ncs-message]
intro-hardcore=Welcome aboard! Your ship in orbit around Nauvis is your main base, and the only place to research.\nHardcore: on planets you can only mine, move things and defend until after Vulcanus. Every factory needs its own research ("Planetary build", after metallurgic science). Fluids go up in barrels from the barrel station.\nThe hub holds machines for your first mining base and a supply capsule. Land on Nauvis through the hub, get back up with the supply capsule or a rocket silo.\nMore in Tips and tricks → Nomad.
intro=Welcome aboard! Your ship in orbit around Nauvis is your main base, and the only place to research.\nThe hub holds machines for your first mining base and a supply capsule. Land on Nauvis through the hub, and get back up with the supply capsule or a rocket silo.\nSend resources and science packs up with the supply capsule.\nMore in Tips and tricks → Nomad.
intro-mining=Welcome aboard! Your ship in orbit around Nauvis is your main base, and the only place to research.\nThe hub holds machines for your first mining base and a supply capsule. Land on Nauvis through the hub, and get back up with the supply capsule or a rocket silo.\nOn planets you can only mine and build simple factories. Send resources up with the supply capsule.\nMore in Tips and tricks → Nomad.
enter-ship-failed=[Nomad] Could not put you on the ship. Please check factorio-current.log.
command-help=Opens the mothership window.

