[tips-and-tricks-item-description]
nomad=The engineer has had enough of the biters. This time he beats Space Age without solid ground under his feet.\n\nYour ship is your main base: home, factory and lab. Grow it freely into a huge mothership, without limits. The planets are mostly there to be mined.
nomad-start=You start on a ready-built ship in orbit around Nauvis, no crash. Everything you would have needed on Nauvis to build this ship is already researched.\n\nThe hub holds starting machines: drills, steam power, solar, assemblers, belts and inserters. Use them to set up your first mining base down on Nauvis.\n\nThe ship can fly right from the start.
nomad-research=Labs can only be built in space, on your ships. You make science packs as usual, but research happens up there.\n\nSend the packs to the ship with the supply capsule or a rocket.
nomad-spacesuit=After researching "Space suit", use the button in the top left to leave the hub and walk around your ship. You float over buildings but never fall into space. In the suit your reach is 100.\n\nYou can only leave the hub while the ship is in orbit. When it departs, you are brought back into the hub. After researching "Space suit: flight-rated" (after Gleba) this also works during flight.
nomad-planets=Land on a planet through the hub. You get back up with the supply capsule or a rocket silo, later also with the recall beam (button in the top left while on a planet).\n\nYou can board the capsule or rocket with a full inventory. It is stowed and given back when you arrive.\n\nIf you die on a planet, you wake up in the hub of your mothership.\n\nDefault rules (variant A): on planets you build mining, logistics, power, defense and simple factories. Bigger factories need research ("Planetary factories", "Planetary industry"). In the hardcore variant D there are no factories on planets until after Vulcanus, every factory needs its own "Planetary build" research, and a barrel station brings fluids up.\n\nTungsten ore: for your first big mining drills, electric mining drills can mine (after the research "Tungsten with electric drills") tungsten ore too, very slowly and with wear. Big volcanic rocks also drop tungsten ore.
nomad-supply=The supply capsule is a small rocket available from the start. It launches small loads to the ship and only needs resources from the planet. Later the rocket silo takes over.\n\nYou can place blueprints on the ship from a planet, the hub builds them. If the hub is missing items, it takes them from the inventory of players on board.\n\nIf a roboport covers the hub, the hub is part of the logistic network.
nomad-extractor=Special floors and ship sources only come from rare deposits on the planets.\n\n1. Find a deposit with the deposit scanner. It has no fixed range but only sees explored areas; every kind lies at least once within about 400 tiles of the map center. Deposits glow in their color.\n2. Place the floor extractor exactly on top, load it, press "Start run".\n3. Survive the run: Vulcanus gets hot (water in, steam out), Gleba sends pentapod waves, Fulgora buries you in unstable scrap, Aquilo needs more and more heat, on Nauvis the pollution brings the biters.\n4. Pick up the result and send it to your ship yourself.
nomad-floors=Special floors are placed in space like foundation. Lava and ammonia pools: an offshore pump at the edge pumps lava or ammoniacal solution. Bio soil (yumako, jellynut): the orbital agricultural tower stands here. Promethium floor: for the matter recombinator and the jump drive.\n\nShip sources (scrap, tungsten, calcite, lithium, fluorine, crude oil, uranium) are placed on the foundation. An infinite deposit appears below for normal drills and pumps.
nomad-cannon=The orbital cannon is artillery on your ship and hits the planet the ship is orbiting. Load it with orbital artillery shells (big blast, 10 s reload), take the orbital targeting remote from the shortcut bar and open the map of that planet: click for one target, or drag a box to mark every nest, worm and turret inside.\n\nRobot shells (distractor, defender, destroyer) release 10 combat robots on impact. They find targets on their own and reveal the map around them.\n\nThe orbital cluster bomb drops 13 orbital shells over a wide area in one shot.
nomad-lategame=After promethium science: living metal (Gleba), promethium cells and the promethium thruster with three times the thrust, but it eats a lot of fuel.\n\nOn promethium floor you build the matter recombinator (raises an item's quality by one level with a 25 % chance, nothing is lost) and the jump drive (jumps straight to a known planet).\n\nThe goal: the final research "Nomad achieved" with all science packs. Then you have won Nomad and can keep playing.

