ncs-rules-variant=Planet rules variant
ncs-research-cost=Research cost (Nomad)

[mod-setting-description]
ncs-respawn-on-ship=If you die on a planet, you wake up in the hub of the mothership. Your corpse with your inventory stays on the planet.
ncs-rules-variant=Decides what you may build on planets.\nIn every variant: labs only work in space, research always happens on the ship.\n\n[font=default-bold]A: Planets only for mining[/font] – default, hard\n• On planets: mining, power, logistics, trains, robots, defense, rocket silo, supply capsule, agricultural tower and simple factories (assembler 1+2, stone and steel furnace, chemical plant, oil refinery).\n• Everything else is processed on the ship.\n• Bigger factories on planets only after research: "Planetary factories" (assembler 3, electric furnace, beacon, centrifuge), late "Planetary industry" (Space Age factories, recycler).\n• In return, planet-bound recipes (planet science, foundry, biochamber …) also work in space.\n\n[font=default-bold]B: Everything allowed on planets[/font] – easy\n• Build everything on planets like in the base game.\n• Only the labs have to be on the ship.\n\n[font=default-bold]C: Space Age buildings only in space[/font] – medium\n• Base game buildings (including assembler 3, beacons, modules) everywhere.\n• The new Space Age buildings (foundry, EM plant, biochamber, cryogenic plant …) only on the ship.\n• Exceptions: recycler and agricultural tower are allowed on planets too.\n\n[font=default-bold]D: Hardcore[/font] – very hard\n• On planets only mining, logistics, power, defense, trains, robots, supply capsule and rocket silo. No factories, no furnaces.\n• Every factory gets its own research "Planetary build: …", all after metallurgic science (so after Vulcanus).\n• A barrel station is allowed from the start so fluids can go up to the ship.\n• Planet-bound recipes work in space, like in A.
ncs-research-cost=Multiplies the number of science packs of every Nomad research (special floors, sources, payload, thruster boost, orbital cannon, "Nomad achieved" …).\nBase game and Space Age research stays unchanged.\n\n1 = default, 0.5 = half the cost, 2 = twice the cost. Allowed: 0.1 to 10.

[string-mod-setting]
ncs-rules-variant-hardcore=D: Hardcore – planets only for mining until after Vulcanus (very hard)
ncs-rules-variant-mining=A: Planets only for mining, factories on the ship (default, hard)
ncs-rules-variant-all=B: Everything allowed on planets, only labs in space (easy)
ncs-rules-variant-space-age=C: Space Age buildings only in space (medium)

