[achievement-description]
ncs-nomad=Research "Nomad achieved" while spending no more than 2 hours on planets in total.
ncs-first-landing=Land on a planet for the first time.
ncs-spacewalk=Leave the hub in your space suit for the first time.
ncs-recall=Return from a planet to your ship with the recall beam.
ncs-first-extraction=Complete your first floor extractor run.
ncs-all-planets=Complete an extractor run on Nauvis, Vulcanus, Gleba, Fulgora and Aquilo.
ncs-avalanche-rider=Complete an extractor run on Fulgora without any unstable scrap exploding on the planet.
ncs-mothership=Build a ship with 10,000 foundation tiles.
ncs-ark=Lay all five special floors on one ship.
ncs-carpet-bombing=Drop an orbital cluster bomb.
ncs-swarm=Have 100 robots from robot shells in action at the same time.
ncs-legendary=Raise an item to legendary quality with the matter recombinator.

[ncs-ending]
title=Nomad achieved
message=The engineer had enough of the biters. So he beat Space Age without solid ground under his feet.\n\nA small ship in orbit around Nauvis became a mothership that no longer needs a planet. The planets were only mines. Home was always the ship.
final=You can keep playing. The mothership is waiting.
chat=[Nomad] Nomad achieved! Your mothership no longer needs a planet.
