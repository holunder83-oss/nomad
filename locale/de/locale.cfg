[tips-and-tricks-item-description]
nomad=Der Ingenieur hat genug von den Beissern. Diesmal schlägt er Space Age ohne festen Boden unter den Füssen.\n\nDein Schiff ist deine Hauptbasis: Zuhause, Fabrik und Labor. Bau es frei zu einem riesigen Mutterschiff aus, ohne Grenzen. Die Planeten sind vor allem zum Abbauen da.
nomad-start=Du startest auf einem fertigen Schiff im Orbit von Nauvis, ohne Absturz. Was du auf Nauvis für dieses Schiff gebraucht hättest, ist schon erforscht.\n\nIm Hub liegen Startmaschinen: Bohrer, Dampfstrom, Solar, Fabriken, Bänder und Greifarme. Damit baust du unten auf Nauvis deinen ersten Abbau auf.\n\nDas Schiff darf ab Start fliegen.
nomad-research=Labore stehen nur im All, also auf deinen Schiffen. Science Packs stellst du wie gewohnt her, aber geforscht wird oben.\n\nSchick die Packs mit der Versorgungskapsel oder einer Rakete zum Schiff.
nomad-spacesuit=Nach der Forschung „Raumanzug“ steigst du über den Knopf oben links aus dem Hub aus und läufst über dein Schiff. Du schwebst über Gebäude, fällst aber nicht ins All. Im Anzug hast du Reichweite 100.\n\nAussteigen geht nur, wenn das Schiff im Orbit steht. Fliegt es los, kommst du automatisch zurück in den Hub. Mit der Forschung „Raumanzug: Flugtauglich“ (nach Gleba) geht es auch im Flug.
nomad-planets=Über den Hub landest du auf einem Planeten. Zurück nach oben kommst du mit der Versorgungskapsel oder einem Raketensilo, später auch mit dem Rückholstrahl (Knopf oben links auf dem Planeten).\n\nIn Kapsel und Rakete steigst du mit vollem Inventar ein, es wird verstaut und kommt oben zurück.\n\nStirbst du auf einem Planeten, wachst du im Hub des Mutterschiffs auf.\n\nStandardregel (Variante A): Auf Planeten baust du Abbau, Logistik, Strom, Verteidigung und einfache Fabriken. Grössere Fabriken kommen erst per Forschung („Planeten-Fabriken“, „Planeten-Industrie“). In der Variante D „Pionier“ gibt es bis nach Vulcanus keine Fabriken auf Planeten, jede Fabrik braucht ihre eigene Forschung „Planetenbau“, und eine Abfüllstation bringt Flüssigkeiten hoch. In der Variante E „Siedler“ darfst du anfangs nur die Grundausstattung für den Abbau bauen, jedes weitere Gebäude braucht eine eigene „Planetenbau“-Forschung, und nur Nauvis ist entdeckt. In der Variante F „Nomade“ bringt jeder Planet nur das Nötigste mit, die übrigen Gebäude kommen erst nach Aquilo bzw. mit Promethium-Science.\n\nWolframerz: Für die ersten grossen Bohrer bauen nach der Forschung „Wolfram mit elektrischen Bohrern“ auch elektrische Bohrer Wolframerz ab, sehr langsam und mit Verschleiss. Grosse Vulkanfelsen geben ebenfalls Wolframerz.
nomad-supply=Die Versorgungskapsel ist eine kleine Rakete ab Spielstart. Sie schiesst kleine Ladungen zum Schiff und braucht dafür nur Rohstoffe des Planeten. Später übernimmt das Raketensilo.\n\nBaupläne auf dem Schiff kannst du auch vom Planeten aus setzen, der Hub baut sie. Fehlt dem Hub etwas, nimmt er es aus dem Inventar der Spieler an Bord.\n\nDeckt ein Roboport den Hub ab, gehört der Hub zum Logistik-Netz.
nomad-extractor=Spezialböden und Schiffs-Quellen gibt es nur aus seltenen Fundstellen auf den Planeten.\n\n1. Fundstelle mit dem Fundstellen-Scanner suchen. Er hat keinen festen Umkreis, sieht aber nur schon erkundetes Gebiet; jede Art liegt mindestens einmal innerhalb von etwa 400 Feldern um die Kartenmitte. Fundstellen leuchten in ihrer Farbe.\n2. Boden-Extraktor genau draufstellen, befüllen, „Lauf starten“.\n3. Den Lauf überstehen: Vulcanus wird heiss (Wasser rein, Dampf raus), auf Gleba kommen Pentapoden-Wellen, auf Fulgora eine Schrott-Lawine aus instabilem Schrott, Aquilo braucht immer mehr Wärme, auf Nauvis lockt die Verschmutzung die Beisser an.\n4. Ergebnis abholen und selbst zum Schiff schicken.
nomad-floors=Spezialböden legst du wie Fundament ins All. Lava- und Ammoniak-Becken: eine Offshore-Pumpe am Rand fördert Lava bzw. Ammoniak-Lösung. Bio-Boden (Yumako, Geleenuss): Hier steht der orbitale Agrarturm. Promethium-Boden: für Materie-Rekombinator und Sprungantrieb.\n\nSchiffs-Quellen (Schrott, Wolfram, Calcit, Lithium, Fluor, Rohöl, Uran) stellst du aufs Fundament. Darunter entsteht eine unendliche Lagerstätte für normale Bohrer und Pumpen.
nomad-cannon=Die Orbitalkanone ist Artillerie auf deinem Schiff und trifft den Planeten, in dessen Orbit das Schiff steht. Befülle sie mit Orbital-Artilleriegranaten (grosse Explosion, 10 s Nachladen), nimm die Orbital-Fernsteuerung aus der Schnellleiste und öffne die Karte dieses Planeten: Klick für ein Ziel, Rahmen ziehen für alle Nester, Würmer und Geschütze darin.\n\nRoboter-Granaten (Distractor, Defender, Destroyer) setzen beim Einschlag 10 Kampfroboter frei. Sie suchen sich selbst Ziele und decken die Karte um sich auf.\n\nDie Orbital-Clusterbombe wirft mit einem Schuss 13 Orbital-Granaten über eine grosse Fläche.
nomad-lategame=Nach der Promethium-Science: Lebendes Metall (Gleba), Promethium-Zellen und der Promethium-Antrieb mit dreifachem Schub, der aber ordentlich Treibstoff frisst.\n\nAuf Promethium-Boden stehen der Materie-Rekombinator (hebt Items mit 25 % Chance eine Qualitätsstufe an, ohne Verlust) und der Sprungantrieb (springt direkt zu einem bekannten Planeten).\n\nDas Ziel: die letzte Forschung „Nomade vollendet“ mit allen Science Packs. Danach hast du Nomad gewonnen und kannst weiterspielen.
nomad-variant-d=Gilt nur, wenn du in den Mod-Einstellungen „Regel-Variante für Planeten“ auf D gestellt hast.\n\n[font=default-bold]Idee:[/font] Planeten sind reine Bergwerke. Verarbeitet wird bis nach Vulcanus nur auf dem Schiff.\n\n[font=default-bold]Auf Planeten ab Start erlaubt:[/font] Abbau (Bohrer, Pumpen, Agrarturm), Logistik (Bänder, Greifarme, Kisten, Rohre, Tanks), Strom, Verteidigung, Züge, Roboter, Schaltungen, Versorgungskapsel, Raketensilo, Frachtlandeplatz und die Abfüllstation.\n\n[font=default-bold]Gesperrt:[/font] alle Fabriken und Öfen. Jede bekommt eine eigene Forschung „Planetenbau: …“, alle nach Metallurgie-Science (also nach Vulcanus). Steinofen und Assembler 1 kosten 500, Giesserei 5000, Kryo-Anlage 20 000.\n\n[font=default-bold]Start:[/font] Im Hub liegen die Startmaschinen und eine Versorgungskapsel. Ohne Ofen auf dem Planeten gibt es zuerst keine Steinziegel für eine eigene Kapsel.\n\n[font=default-bold]So kommst du voran:[/font] Kohle, Erz und Stein mit der Kapsel hochschicken und auf dem Schiff schmelzen. Flüssigkeiten füllt die Abfüllstation in Fässer, die Kapsel oder das Silo bringt sie hoch.
nomad-variant-e=Gilt nur, wenn du in den Mod-Einstellungen „Regel-Variante für Planeten“ auf E gestellt hast.\n\n[font=default-bold]Idee:[/font] Auf Planeten darfst du fast nichts. Jedes weitere Gebäude erforschst du einzeln.\n\n[font=default-bold]Auf Planeten ab Start erlaubt:[/font] Solarpanel, elektrischer und Brennstoff-Bohrer, kleiner Strommast, gelbes Band, Brennstoff-Greifarm, Holzkiste, Versorgungskapsel, Frachtlandeplatz, die Abfüllstation (füllt und leert nur Fässer) und das kleine MG-Geschütz (1×1, schwach, ab Start herstellbar).\n\n[font=default-bold]Alles andere:[/font] je eine eigene Forschung „Planetenbau: …“, gestaffelt. Zuerst nur rote Packs: Greifarm und Eisenkiste 50, Untergrundband, Splitter und Rohre 100, Gatling-Geschütz 150, Steinofen 200, Assembler 1 300. Danach Rot + Grün (Dampf, Stahlofen, Züge), mit Blau (Chemie, Raffinerie, Roboter), mit Weltraum-Science (Agrarturm, Heizturm, Raketensilo) und zuletzt mit den Planeten-Packs.\n\n[font=default-bold]Planeten:[/font] Nur Nauvis ist entdeckt. Vulcanus, Fulgora und Gleba erforschst du selbst.\n\n[font=default-bold]Im Hub:[/font] 40 elektrische und 40 Brennstoff-Bohrer, 100 Solarpanels, 200 kleine Strommasten, 600 gelbe Bänder, 100 Brennstoff-Greifarme, 50 Holzkisten, 200 fester Brennstoff, 1 Versorgungskapsel, 10 kleine MG-Geschütze, 200 rote Munition, 1 Frachtlandeplatz, 400 Kupfererz, je 20 Assembler 1 und Stahlöfen.\n\n[font=default-bold]Tipps:[/font]\n• Strom gibt es anfangs nur aus Solar. Nachts stehen elektrische Bohrer und Kapsel still, Brennstoff-Bohrer laufen weiter.\n• Brennstoff-Greifarme tanken nur, wenn sie Brennstoff greifen. Lege Kohle und Erz auf dasselbe Band, die Kapsel braucht ohnehin Kohle.\n• Kupfer und Stein, die die Kapsel nicht verbaut, legen die Greifarme direkt in ihren Frachtraum.\n• Du hast nur eine Kapsel. Verteidige sie gut: Ohne Stein vom Planeten kannst du keine neue bauen.
nomad-variant-f=Gilt nur, wenn du in den Mod-Einstellungen „Regel-Variante für Planeten“ auf F gestellt hast.\n\n[font=default-bold]Idee:[/font] Jeder Planet bringt nur das Allernötigste mit, um ihn zu schaffen. Alles andere kommt erst ganz spät.\n\n[font=default-bold]Ab Start erlaubt:[/font] wie bei E (Solarpanel, Bohrer, kleiner Strommast, gelbes Band, Brennstoff-Greifarm, Holzkiste, Versorgungskapsel, Frachtlandeplatz, Abfüllstation, kleines MG-Geschütz), dazu Raketensilo, Frachtraum, Landeplatz-Entladeraum, Pumpjack, Rohre und Untergrundrohre (Rohöl pumpen und abfüllen). Nur Nauvis ist entdeckt, im Hub liegt dasselbe wie bei E.\n\n[font=default-bold]Bänder und Greifarme[/font] kommen nach jedem Planeten, je eine eigene Forschung:\n• Nauvis: gelbe Untergrundbänder und Splitter, Greifarm und langer Greifarm (je 100 rote Packs)\n• Vulcanus: rote Bänder, schneller Greifarm (mit Metallurgie-Science)\n• Fulgora: blaue Bänder, Massengreifer (mit EM-Science)\n• Gleba: Turbo-Bänder, Stapelgreifer (mit Agrar-Science)\n\n[font=default-bold]Komfort[/font] früh auf Nauvis (eine Forschung, 200 rote und grüne Packs): Radar, Lampe, alle Kombinatoren, Schalter, Lautsprecher und Anzeigetafel.\n\n[font=default-bold]Planeten-Pakete[/font] nach der Entdeckung des Planeten:\n• Vulcanus: Offshore-Pumpe (Lava für die Kapsel)\n• Fulgora: Blitzableiter und Akku (Strom in der Nacht)\n• Gleba: Agrarturm, dazu darf jeder Geschützturm einzeln erforscht werden\n• Aquilo: Heizturm und Wärmerohr (Kapsel warm halten)\n\n[font=default-bold]Extraktor-Pakete[/font] nach „Boden-Extraktor“, damit die Läufe gehen:\n• Nauvis: Gatling-Geschütz und Steinmauer gegen die Beisser\n• Vulcanus: Chemieanlage und Lagertank. Wasser bekommst du, indem du Eis vom Schiff schmilzt oder Säure neutralisierst. Den Dampf aus dem Extraktor kondensieren Chemieanlagen wieder zu Wasser.\n• Fulgora: Assembler 1, um den instabilen Schrott zu stabilisieren\n• Gleba und Aquilo: Geschütztürme bzw. Heizturm aus den Planeten-Paketen reichen\n\n[font=default-bold]Alles andere:[/font] Gebäude aus dem Grundspiel erst nach Aquilo (Kryo-Science), Space-Age-Gebäude erst mit Promethium-Science, jeweils in Paketen (Kisten, Strom, Produktion, Züge, Roboter …).\n\n[font=default-bold]Tipps:[/font]\n• Auf Fulgora, Gleba und Aquilo gibt es keine Kohle. Brennstoff für Brennstoff-Bohrer und -Greifarme schickst du vom Schiff über den Frachtlandeplatz.\n• Bis nach Aquilo kommt alles über Kapsel und Raketensilo hoch, die Raketenteile für das Silo macht das Schiff.

