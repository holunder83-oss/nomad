[entity-description]
ncs-small-gun-turret=Kleines, schwaches Gatling-Geschütz (1×1) für die Varianten E „Siedler“ und F „Nomade“. Ab Start herstellbar und auf Planeten baubar.
ncs-hard-drill=Kann nach der Forschung „Wolfram mit elektrischen Bohrern“ auch Wolframerz abbauen, dort aber nur mit einem Zehntel des Tempos, und er nimmt dabei langsam Schaden (nach etwa 20 Minuten kaputt). Reicht für die ersten grossen Bohrer.
ncs-barrel-filler=Füllt und leert Fässer, sonst nichts. Ab Start auf Planeten erlaubt.
ncs-orbital-cannon=Beschiesst nur den Planeten, in dessen Orbit das Schiff steht. Ziele mit der Orbital-Fernsteuerung setzen (Knopf in der Schnellleiste). Nimmt Orbital-Artilleriegranaten (10 s Nachladen) und Roboter-Granaten (2 s), keine normalen Artilleriegranaten.
ncs-extractor=Steht auf einer Fundstelle und bekommt selbst das passende Rezept. Ein Lauf startet erst per Knopf im Fenster und dauert 5 Minuten. Das Ergebnis bleibt im Ausgang, bis du es abholst; erst dann geht der nächste Lauf.
ncs-core=Seltene Fundstelle. Stell einen Boden-Extraktor genau darauf (3×3). Die Zahl ist die Anzahl der verbleibenden Läufe.
ncs-large-cargo-bay=Bringt dem Hub bzw. Landefeld 100 zusätzliche Lagerplätze.
ncs-tungsten-vein=Unendliche Wolfram-Lagerstätte. Stell einen Bohrer darüber. Abbauen der Ader entfernt die Lagerstätte, du bekommst die Ader zurück.
ncs-calcite-vein=Unendliche Calcit-Lagerstätte. Stell einen Bohrer darüber. Abbauen der Ader entfernt die Lagerstätte, du bekommst die Ader zurück.
ncs-oil-source=Unendliche Rohöl-Quelle. Stell einen Pumpjack darüber. Abbauen der Quelle entfernt sie, du bekommst sie zurück.
ncs-uranium-vein=Unendliche Uran-Lagerstätte. Stell einen Bohrer darüber (braucht Schwefelsäure). Abbauen der Ader entfernt die Lagerstätte, du bekommst die Ader zurück.
ncs-lithium-source=Unendliche Lithium-Sole. Stell eine Pumpe darüber. Abbauen der Quelle entfernt sie, du bekommst sie zurück.
ncs-fluorine-source=Unendlicher Fluor-Schlot. Stell eine Pumpe darüber. Abbauen der Quelle entfernt sie, du bekommst sie zurück.
ncs-scrap-vein=Unendliche Schrott-Lagerstätte. Stell einen Bohrer darüber. Abbauen der Ader entfernt die Lagerstätte, du bekommst die Ader zurück.
ncs-promethium-thruster=Stärkeres Triebwerk für das schwere Mutterschiff. Verbrennt Promethium-Treibstoff statt Triebwerkstreibstoff.
ncs-matter-recombinator=Verbessert gezielt die Qualität einzelner Items, ohne Recycling-Schleife.\n\n[font=default-bold]So funktioniert er:[/font]\n• Lege ein beliebiges Item hinein (z. B. ein Gebäude, Modul oder eine Waffe). Er wählt das Rezept selbst, wie ein Ofen.\n• Nach 10 Sekunden kommt dasselbe Item wieder heraus. Mit 25 % Chance ist es eine Qualitätsstufe besser, selten auch mehrere. Sonst bleibt es gleich, es geht nie etwas verloren.\n• Legendäre Items werden nicht mehr besser.\n\n[font=default-bold]Betrieb:[/font]\n• Brennstoff: Promethium-Zellen. Eine Zelle reicht für 10 Items.\n• Das Ergebnisfach hat nur einen Platz, und verschiedene Qualitäten stapeln nicht: Hol die Ergebnisse mit einem Greifarm ab, sonst stoppt er.\n• Keine Module, keine Beacons.\n• Nur im All auf Promethium-Boden.
ncs-jump-drive=Springt mit dem Schiff direkt zu einem entdeckten Planeten. Kostet 50 Promethium-Zellen pro Sprung. Nur auf Promethium-Boden.
ncs-orbital-agricultural-tower=Agrarturm für das Mutterschiff. Funktioniert nur im All auf Bio-Boden (Yumako oder Geleenuss). Yumako wächst auf dem hellgrünen, Geleenuss auf dem magentafarbenen Bio-Boden.
ncs-supply-capsule=Kleiner als ein Raketensilo: Ballert kleine Ladungen zu einem Schiff im Orbit. Startet auf jedem Planeten mit dessen Rohstoffen: Nauvis Kohle + Eisenerz, Vulcanus Lava + Calcit, Gleba Yumako + Geleenuss + Stein, Fulgora Schrott, Aquilo Ammoniak-Lösung + Lithium-Sole (Ammoniak waagerecht links und rechts, Sole senkrecht oben und unten, beide durchgehend; die Kapsel lässt sich nicht drehen), sonst nur mit Strom (langsamer). Steht die Rakete bereit, füllen angehakte Zutaten den Frachtraum und fliegen mit. Nimmt auch dich mit: Einsteigen wie beim Raketensilo.

