[mod-setting-description]
ncs-respawn-on-ship=Wer auf einem Planeten stirbt, wacht im Hub des Mutterschiffs auf. Die Leiche mit dem Inventar bleibt auf dem Planeten.
ncs-rules-variant=Legt fest, was du auf Planeten bauen darfst.\nIn allen Varianten gilt: Labore stehen nur im All, geforscht wird immer auf dem Schiff.\n\n[font=default-bold]A: Planeten nur Abbau[/font] – Standard, schwer\n• Auf Planeten: abbauen, Strom, Logistik, Züge, Roboter, Verteidigung, Raketensilo, Versorgungskapsel, Agrarturm und einfache Fabriken (Assembler 1+2, Stein- und Stahlofen, Chemieanlage, Raffinerie).\n• Alles andere verarbeitest du auf dem Schiff.\n• Grössere Fabriken auf Planeten erst per Forschung: „Planeten-Fabriken“ (Assembler 3, Elektroofen, Beacon, Zentrifuge), spät „Planeten-Industrie“ (Space-Age-Fabriken, Recycler).\n• Dafür gehen planetengebundene Rezepte (Planeten-Science, Giesserei, Biokammer …) auch im All.\n\n[font=default-bold]B: Auf Planeten alles erlaubt[/font] – leicht\n• Auf Planeten baust du alles wie im Grundspiel.\n• Nur die Labore müssen aufs Schiff.\n\n[font=default-bold]C: Space-Age-Gebäude nur im All[/font] – mittel\n• Gebäude aus dem Grundspiel (auch Assembler 3, Beacons, Module) überall.\n• Die neuen Space-Age-Gebäude (Giesserei, EM-Anlage, Biokammer, Kryo-Anlage …) nur auf dem Schiff.\n• Ausnahmen: Recycler und Agrarturm dürfen auch auf Planeten.\n\n[font=default-bold]D: Pionier[/font] – sehr schwer\n• Auf Planeten nur Abbau, Logistik, Strom, Verteidigung, Züge, Roboter, Versorgungskapsel und Raketensilo. Keine Fabriken, keine Öfen.\n• Jede Fabrik bekommt eine eigene Forschung „Planetenbau: …“, alle nach Metallurgie-Science (also nach Vulcanus).\n• Eine Abfüllstation ist ab Start erlaubt, damit Flüssigkeiten aufs Schiff kommen.\n• Planetengebundene Rezepte gehen im All, wie bei A.\n\n[font=default-bold]E: Siedler[/font] – extrem schwer\n• Auf Planeten ab Start nur Solarpanel, elektrischer und Brennstoff-Bohrer, kleiner Strommast, gelbes Band, Brennstoff-Greifarm, Holzkiste, Versorgungskapsel, Frachtlandefeld und das kleine MG-Geschütz.\n• Jedes andere Gebäude (auch Greifarm, Untergrundband, Rohre, Geschütz …) bekommt eine eigene Forschung „Planetenbau: …“, die ersten schon mit roten Packs.\n• Von den Planeten ist nur Nauvis entdeckt.\n• Planetengebundene Rezepte gehen im All, wie bei A.\n\n[font=default-bold]F: Nomade[/font] – brutal\n• Grundausstattung wie bei E und dazu Raketensilo, Frachtraum und Landeplatz-Entladeraum, nur Nauvis entdeckt.\n• Pro Planet nur das Nötigste, je ein Paket nach der Entdeckung: Vulcanus Offshore-Pumpe, Fulgora Blitzableiter und Akku, Gleba Agrarturm und alle Geschütztürme, Aquilo Heizturm und Wärmerohr. Pumpjack und Rohre ab Start.\n• Bänder und Greifarme nach jedem Planeten, je eine eigene Forschung (gelbes Band ab Start): gelbe Untergrundbänder und Splitter sowie Greifarm früh, rote Bänder und schneller Greifarm nach Vulcanus, blaue Bänder und Massengreifer nach Fulgora, Turbo-Bänder und Stapelgreifer nach Gleba.\n• Extraktor-Pakete für die Herausforderungen: Nauvis Geschütz und Mauer, Vulcanus Chemieanlage und Tank, Fulgora Assembler 1.\n• Alle anderen Gebäude aus dem Grundspiel erst nach Aquilo (Kryo-Science), Space-Age-Gebäude erst mit Promethium-Science, in Paketen (Logistik, Flüssigkeiten, Strom, Produktion …).
ncs-research-cost=Faktor für die Anzahl Science Packs aller Nomad-Forschungen (Spezialböden, Quellen, Traglast, Triebwerk-Boost, Orbitalkanone, „Nomade vollendet“ …).\nForschungen aus dem Grundspiel und Space Age bleiben unverändert.\n\n1 = Standard, 0,5 = halb so teuer, 2 = doppelt so teuer. Erlaubt: 0,1 bis 10.
ncs-capsule-volume=Lautstärke der Versorgungskapsel in Prozent: Türen, Rakete und die Explosionen beim Start.\n100 = normal, 50 = halb so laut, 0 = still.\nDie Frachtkapsel auf dem Weg zum Schiff ist dieselbe wie beim Raketensilo und bleibt so laut wie bisher.

[string-mod-setting]
ncs-rules-variant-super-hardcore=E: Siedler – auf Planeten fast nichts, jedes Gebäude einzeln (extrem schwer)
ncs-rules-variant-super-duper-hardcore=F: Nomade – pro Planet nur das Nötigste (brutal)
ncs-rules-variant-hardcore=D: Pionier – keine Fabriken bis nach Vulcanus (sehr schwer)
ncs-rules-variant-mining=A: Planeten nur Abbau, Fabriken aufs Schiff (Standard, schwer)
ncs-rules-variant-all=B: Auf Planeten alles erlaubt, nur Labore im All (leicht)
ncs-rules-variant-space-age=C: Space-Age-Gebäude nur im All (mittel)

