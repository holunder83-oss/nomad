[ncs-message]
intro-hardcore=Willkommen an Bord! Dein Schiff im Orbit von Nauvis ist deine Hauptbasis, nur hier wird geforscht.\nPionier: Auf Planeten gehen bis nach Vulcanus nur Abbau, Logistik und Verteidigung. Jede Fabrik braucht ihre eigene Forschung („Planetenbau“, nach Metallurgie-Science). Flüssigkeiten gehen in Fässern aus der Abfüllstation hoch.\nIm Hub liegen Maschinen für deinen ersten Abbau und eine Versorgungskapsel. Lande über den Hub auf Nauvis, zurück nach oben kommst du mit der Versorgungskapsel oder einem Raketensilo.\nMehr unter Tipps und Tricks → Nomad → Variante D: Pionier.
intro-super-hardcore=Willkommen an Bord! Dein Schiff im Orbit von Nauvis ist deine Hauptbasis, nur hier wird geforscht.\nSiedler: Auf Planeten darfst du anfangs nur Solarpanels, Bohrer, kleine Strommasten, gelbe Bänder, Brennstoff-Greifarme, Holzkisten, die Versorgungskapsel, das Frachtlandefeld, die Abfüllstation und kleine MG-Geschütze bauen. Jedes weitere Gebäude braucht eine eigene Forschung („Planetenbau“). Nur Nauvis ist entdeckt.\nIm Hub liegen Maschinen, eine Versorgungskapsel und kleine MG-Geschütze. Lande über den Hub auf Nauvis, zurück nach oben kommst du mit der Versorgungskapsel.\nMehr unter Tipps und Tricks → Nomad → Variante E: Siedler.
intro-super-duper-hardcore=Willkommen an Bord! Dein Schiff im Orbit von Nauvis ist deine Hauptbasis, nur hier wird geforscht.\nNomade: Auf Planeten darfst du nur Solarpanels, Bohrer, kleine Strommasten, gelbe Bänder, Brennstoff-Greifarme, Holzkisten, die Versorgungskapsel, das Raketensilo, den Frachtlandeplatz mit Frachtraum und Entladeraum, Pumpjacks, Rohre, die Abfüllstation und kleine MG-Geschütze bauen. Jeder Planet bringt nach seiner Entdeckung nur das Nötigste mit, alles andere kommt erst nach Aquilo bzw. mit Promethium-Science. Nur Nauvis ist entdeckt.\nIm Hub liegen Maschinen, eine Versorgungskapsel und kleine MG-Geschütze. Lande über den Hub auf Nauvis, zurück nach oben kommst du mit der Versorgungskapsel.\nMehr unter Tipps und Tricks → Nomad → Variante F: Nomade.
intro=Willkommen an Bord! Dein Schiff im Orbit von Nauvis ist deine Hauptbasis, nur hier wird geforscht.\nIm Hub liegen Maschinen für deinen ersten Abbau und eine Versorgungskapsel. Lande damit über den Hub auf Nauvis, zurück nach oben kommst du mit der Versorgungskapsel oder einem Raketensilo.\nRohstoffe und Science Packs schickst du mit der Versorgungskapsel hoch.\nMehr unter Tipps und Tricks → Nomad.
intro-mining=Willkommen an Bord! Dein Schiff im Orbit von Nauvis ist deine Hauptbasis, nur hier wird geforscht.\nIm Hub liegen Maschinen für deinen ersten Abbau und eine Versorgungskapsel. Lande damit über den Hub auf Nauvis, zurück nach oben kommst du mit der Versorgungskapsel oder einem Raketensilo.\nAuf Planeten gehen nur Abbau und einfache Fabriken. Rohstoffe schickst du mit der Versorgungskapsel hoch.\nMehr unter Tipps und Tricks → Nomad.
enter-ship-failed=[Nomad] Konnte dich nicht auf das Schiff setzen. Bitte factorio-current.log prüfen.
command-help=Öffnet das Mutterschiff-Fenster.

