[achievement-description]
ncs-nomad=Erforsche „Nomade vollendet“ und verbring dabei insgesamt höchstens 2 Stunden auf Planeten.
ncs-first-landing=Lande zum ersten Mal auf einem Planeten.
ncs-spacewalk=Steig zum ersten Mal mit dem Raumanzug aus dem Hub aus.
ncs-recall=Kehre mit dem Rückholstrahl von einem Planeten zurück aufs Schiff.
ncs-first-extraction=Schaffe deinen ersten Lauf mit dem Boden-Extraktor.
ncs-all-planets=Schaffe auf Nauvis, Vulcanus, Gleba, Fulgora und Aquilo je einen Extraktor-Lauf.
ncs-avalanche-rider=Schaffe einen Extraktor-Lauf auf Fulgora, ohne dass auf dem Planeten instabiler Schrott explodiert.
ncs-mothership=Bau ein Schiff mit 10 000 Fundament-Feldern.
ncs-ark=Leg alle fünf Spezialböden auf einem Schiff aus.
ncs-carpet-bombing=Wirf eine Orbital-Clusterbombe ab.
ncs-swarm=Hab 100 Roboter aus Roboter-Granaten gleichzeitig im Einsatz.
ncs-legendary=Bring mit dem Materie-Rekombinator ein Item auf legendäre Qualität.

[ncs-ending]
title=Nomade vollendet
message=Der Ingenieur hatte genug von den Beissern. Also hat er Space Age geschlagen, ohne festen Boden unter den Füssen.\n\nAus einem kleinen Schiff im Orbit von Nauvis wurde ein Mutterschiff, das keinen Planeten mehr braucht. Die Planeten waren nur Minen. Das Zuhause war immer das Schiff.
final=Du kannst weiterspielen. Das Mutterschiff wartet.
chat=[Nomad] Nomade vollendet! Dein Mutterschiff braucht keinen Planeten mehr.
