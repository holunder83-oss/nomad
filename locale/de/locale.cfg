[item-description]
ncs-barrel-filler=Varianten D „Pionier“, E „Siedler“ und F „Nomade“: füllt und leert Fässer, sonst nichts. Ab Start auf Planeten erlaubt, damit Flüssigkeiten aufs Schiff kommen.
ncs-orbital-cluster-shell=Nur für die Orbitalkanone: Nach dem Einschlag im Ziel regnen 12 weitere Orbital-Granaten im Umkreis von 25 Feldern herab. Danach braucht die Kanone 30 Sekunden zum Nachladen.
ncs-orbital-artillery-shell=Granate nur für die Orbitalkanone: Explosionsradius 10 statt 4 und mehr Schaden. Danach braucht die Kanone 10 Sekunden zum Nachladen.
ncs-distractor-artillery-shell=Setzt beim Einschlag 10 Distractor frei, die sich selbst Ziele suchen, bis ihre Zeit abläuft. Geht auch in der Orbitalkanone.
ncs-defender-artillery-shell=Setzt beim Einschlag 10 Defender frei, die sich selbst Ziele suchen, bis ihre Zeit abläuft. Geht auch in der Orbitalkanone.
ncs-destroyer-artillery-shell=Setzt beim Einschlag 10 Destroyer frei, die sich selbst Ziele suchen, bis ihre Zeit abläuft. Geht auch in der Orbitalkanone.
ncs-orbital-cannon=Artilleriegeschütz für das Schiff. Beschiesst den Planeten, in dessen Orbit das Schiff steht. Mit Orbital-Artilleriegranaten oder Roboter-Granaten befüllen und mit der Orbital-Fernsteuerung (Knopf in der Schnellleiste) zielen.
ncs-orbital-targeting=In der Kartenansicht eines Planeten: Klick setzt ein Ziel, ein Rahmen markiert alle Nester, Würmer und Geschütze darin. Es schiessen alle Orbitalkanonen deiner Schiffe im Orbit dieses Planeten. Ohne Reichweiten-Grenze.
ncs-core-scanner=In die Hand nehmen und irgendwohin klicken: Ein Pfeil zeigt zur nächsten Fundstelle, im Chat steht pro Art die nächste mit Entfernung und Kartenlink. Kein fester Umkreis: Er durchsucht den ganzen Planeten, findet aber nur Fundstellen im schon erkundeten Gebiet (Radar hilft). Jede Art gibt es auf jedem Planeten mindestens einmal innerhalb von etwa 400 Feldern um die Kartenmitte.
ncs-unstable-scrap=Kommt aus der Schrott-Lawine des Boden-Extraktors. Explodiert nach 45 Sekunden, auch in Kisten und auf Bändern (eine Explosion pro vollem Stapel). Rechtzeitig in einer Montagemaschine stabilisieren oder direkt in den Recycler geben.
ncs-extractor=Holt Spezialböden und Schiffs-Quellen aus Fundstellen auf den Planeten. Auf eine Fundstelle stellen, Zutaten einlegen, Lauf starten. Das Ergebnis bleibt im Extraktor, bis du es abholst.
ncs-large-cargo-bay=Wird an Hub oder Landefeld angebaut wie eine normale Frachtbucht, bringt aber 100 statt 20 zusätzliche Lagerplätze.
ncs-tungsten-vein=Unendliches Wolframerz für das Schiff. Auf Fundament stellen, darunter entsteht eine Lagerstätte (3×3) für normale Bohrer. Wird nie leer. Gibt es nur aus dem Boden-Extraktor.
ncs-calcite-vein=Unendlicher Calcit für das Schiff. Auf Fundament stellen, darunter entsteht eine Lagerstätte (3×3) für normale Bohrer. Wird nie leer. Gibt es nur aus dem Boden-Extraktor.
ncs-oil-source=Unendliches Rohöl für das Schiff. Auf Fundament stellen und einen Pumpjack darüber setzen. Wird nie leer. Gibt es nur aus dem Boden-Extraktor.
ncs-uranium-vein=Unendliches Uranerz für das Schiff. Auf Fundament stellen, darunter entsteht eine Lagerstätte (3×3) für normale Bohrer (brauchen Schwefelsäure). Wird nie leer. Gibt es nur aus dem Boden-Extraktor.
ncs-living-metal-anywhere=Metall, das von Pentapoden-Gewebe durchwachsen ist und Promethium bindet. Wird in der Biokammer gezüchtet. Grundstoff für Promethium-Zellen.
ncs-ammonia-pool=Ammoniak-Ozean im All. Wird wie Plattform-Fundament gelegt. Eine normale Offshore-Pumpe am Rand fördert Ammoniak-Lösung. Gibt es nur aus dem Boden-Extraktor.
ncs-lithium-source=Unendliche Lithium-Sole für das Schiff. Auf Fundament stellen und eine Pumpe darüber setzen. Wird nie leer. Gibt es nur aus dem Boden-Extraktor.
ncs-fluorine-source=Unendlicher Fluor-Schlot für das Schiff. Auf Fundament stellen und eine Pumpe darüber setzen. Wird nie leer. Gibt es nur aus dem Boden-Extraktor.
ncs-scrap-vein=Unendliche Schrott-Quelle für das Schiff. Auf Fundament stellen, darunter entsteht eine Schrott-Lagerstätte (3×3), die du mit normalen Bohrern abbaust. Sie wird nie leer. Gibt es nur aus dem Boden-Extraktor.
ncs-living-metal=Metall, das von Pentapoden-Gewebe durchwachsen ist und Promethium bindet. Wird nur auf Gleba in der Biokammer gezüchtet. Grundstoff für Promethium-Zellen.
ncs-promethium-cell=Brennstoff für Materie-Rekombinator und Sprungantrieb. Braucht Lebendes Metall von Gleba.
ncs-matter-recombinator=Verbessert gezielt die Qualität einzelner Items: 1 Item rein, dasselbe Item raus, mit 25 % Chance eine Qualitätsstufe besser. Es geht nie etwas verloren. Läuft mit Promethium-Zellen (10 Items pro Zelle). Nur im All auf Promethium-Boden.
ncs-suit-armor=Raumanzug-Variante: Draussen auf dem Schiff schwebst du damit über Gebäude. Wird beim Einsteigen wieder zur normalen Rüstung.
ncs-supply-capsule=Kleiner als ein Raketensilo: Ballert kleine Ladungen zu einem Schiff im Orbit. Startet auf jedem Planeten mit dessen Rohstoffen: Nauvis Kohle + Eisenerz, Vulcanus Lava + Calcit, Gleba Yumako + Geleenuss + Stein, Fulgora Schrott, Aquilo Ammoniak-Lösung + Lithium-Sole (Ammoniak waagerecht links und rechts, Sole senkrecht oben und unten, beide durchgehend; die Kapsel lässt sich nicht drehen), sonst nur mit Strom (langsamer). Steht die Rakete bereit, füllen angehakte Zutaten den Frachtraum und fliegen mit. Nimmt auch dich mit: Einsteigen wie beim Raketensilo.
ncs-lava-pool=Lava im All. Wird wie Plattform-Fundament gelegt. Eine normale Offshore-Pumpe am Rand fördert Lava, damit läuft die Giesserei auf dem Schiff. Gibt es nur aus dem Boden-Extraktor.
ncs-bio-foundation=Gleba-Erde für Yumako im All. Wird wie Plattform-Fundament gelegt. Hier wachsen Yumako-Bäume, gepflanzt vom orbitalen Agrarturm. Gibt es nur aus dem Boden-Extraktor.
ncs-jellynut-foundation=Gleba-Erde für Geleenuss im All. Wird wie Plattform-Fundament gelegt. Hier wachsen Geleestrünke, gepflanzt vom orbitalen Agrarturm. Gibt es nur aus dem Boden-Extraktor.
ncs-promethium-foundation=Wird wie Plattform-Fundament gelegt. Nur hier stehen Materie-Rekombinator und Sprungantrieb. Teuer in der Herstellung.

