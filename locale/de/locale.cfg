[technology-description]
ncs-tungsten-drilling=Elektrische Bohrer dürfen auf Wolframerz stehen. Sie bauen es nur sehr langsam ab und nehmen dabei Schaden, reicht aber für die ersten grossen Bohrer.
ncs-nomad-achieved=Die letzte Forschung. Danach braucht dein Mutterschiff keinen Planeten mehr.
ncs-orbital-cluster-shell=Ein Bombenteppich aus dem Orbit: 13 Orbital-Granaten in einem Schuss, verteilt über 25 Felder um das Ziel.
ncs-distractor-artillery-shell=Eine Artilleriegranate, die beim Einschlag 10 Distractor freisetzt. Sie fliegen selbst zum nächsten Gegner.
ncs-defender-artillery-shell=Eine Artilleriegranate, die beim Einschlag 10 Defender freisetzt. Sie fliegen selbst zum nächsten Gegner.
ncs-destroyer-artillery-shell=Eine Artilleriegranate, die beim Einschlag 10 Destroyer freisetzt. Sie fliegen selbst zum nächsten Gegner.
ncs-orbital-cannon=Artillerie vom Schiff aus: Räum Nester rund um eine Fundstelle, bevor du landest.
ncs-extractor=Ein Gebäude für die Planeten, das Spezialböden und Schiffs-Quellen aus seltenen Fundstellen holt. Welche Fundstelle es abbauen darf, schaltet die Forschung des jeweiligen Bodens bzw. der Quelle frei.
ncs-planet-factories=Variante A: Auch Assembler 3, Elektroofen, Beacon und Zentrifuge dürfen auf Planeten stehen.
ncs-planet-industry=Variante A: Auch die Space-Age-Fabriken (Giesserei, EM-Anlage, Biokammer, Kryo-Anlage, Recycler …) dürfen auf Planeten stehen.
ncs-thruster-boost=Alle deine Schiffe reisen schneller zwischen Planeten, bei gleichem Treibstoffverbrauch. Gilt sofort.
ncs-recall-beam=Holt dich mit deinem ganzen Inventar von einem Planeten zurück in den Hub eines Schiffs im Orbit, ohne Raketensilo. Knopf oben links, wenn du auf einem Planeten stehst; bei mehreren Schiffen im Orbit wählst du eins aus.
ncs-large-cargo-bay=Eine Frachtbucht mit 100 statt 20 Plätzen, damit der Hub bei viel Transport nicht voll läuft.
ncs-tungsten-vein=Vulcanus' Wolfram fürs Schiff: eine unendliche Wolfram-Lagerstätte, die man aufs Fundament stellt und mit normalen Bohrern abbaut. Danach holt der Boden-Extraktor sie aus Fundstellen auf dem Planeten.
ncs-calcite-vein=Vulcanus' Calcit fürs Schiff: eine unendliche Calcit-Lagerstätte, die man aufs Fundament stellt und mit normalen Bohrern abbaut. Danach holt der Boden-Extraktor sie aus Fundstellen auf dem Planeten.
ncs-oil-source=Rohöl fürs Schiff: eine unendliche Rohöl-Quelle, die man aufs Fundament stellt und mit einem Pumpjack fördert. Danach holt der Boden-Extraktor sie aus Fundstellen auf dem Planeten.
ncs-uranium-vein=Uran fürs Schiff: eine unendliche Uran-Lagerstätte, die man aufs Fundament stellt und mit normalen Bohrern abbaut. Danach holt der Boden-Extraktor sie aus Fundstellen auf dem Planeten.
ncs-rocket-capacity=Raketensilos und Versorgungskapseln tragen mehr ins All. Gilt sofort für alle gebauten Silos (getauscht wird, sobald keine Rakete im Silo bereitsteht).
ncs-lithium-source=Aquilos Lithium fürs Schiff: Die Lithium-Quelle ist eine unendliche Lithium-Sole, die man aufs Fundament stellt und mit einer Pumpe fördert. Danach holt der Boden-Extraktor sie aus Fundstellen auf dem Planeten.
ncs-fluorine-source=Aquilos Fluor fürs Schiff: Die Fluor-Quelle ist ein unendlicher Fluor-Schlot, den man aufs Fundament stellt und mit einer Pumpe fördert. Danach holt der Boden-Extraktor sie aus Fundstellen auf dem Planeten.
ncs-ammonia-zone=Ammoniak-Becken für das Mutterschiff: Eine normale Offshore-Pumpe am Rand fördert Ammoniak-Lösung. Danach holt der Boden-Extraktor sie aus Fundstellen auf dem Planeten.
ncs-scrap-vein=Fulgoras Schrott fürs Schiff: Die Schrott-Ader ist eine unendliche Schrott-Lagerstätte, die man aufs Fundament stellt und mit normalen Bohrern abbaut. Danach holt der Boden-Extraktor sie aus Fundstellen auf dem Planeten.
ncs-living-metal=Pentapoden-Gewebe bindet Promethium in Metall. Lebendes Metall wird auf Gleba in der Biokammer gezüchtet und ist der Grundstoff für Promethium-Zellen.
ncs-living-metal-anywhere=Pentapoden-Gewebe bindet Promethium in Metall. Lebendes Metall wird in der Biokammer gezüchtet und ist der Grundstoff für Promethium-Zellen.
ncs-spacesuit=Du kannst auf deinen Schiffen aus dem Hub aussteigen und mit deiner Spielfigur herumlaufen, bauen und Maschinen bedienen. Im Anzug schwebst du über Gebäude, aber nicht über den Rand ins All. Nur, solange das Schiff im Orbit steht.
ncs-spacesuit-flight=Kohlefaser-Verstärkung für den Raumanzug: Du kannst auch aussteigen und draussen bleiben, während das Schiff fliegt. Vorsicht am vorderen Rand: Asteroiden können dich dort töten.
ncs-promethium-drive=Promethium als Treibstoff: Promethium-Zellen, Promethium-Treibstoff und ein stärkeres Triebwerk für das schwere Mutterschiff.
ncs-promethium-zone=Promethium-Boden für das Mutterschiff. Nur darauf stehen Materie-Rekombinator und Sprungantrieb.
ncs-lava-zone=Lava-Becken für das Mutterschiff: Eine normale Offshore-Pumpe am Rand fördert Lava, damit läuft die Giesserei im All. Der Boden-Extraktor holt sie aus Lava-Fundstellen auf Vulcanus.
ncs-bio-zone=Hellgrüner Bio-Boden für das Mutterschiff: Yumako-Bäume wachsen darauf, gepflanzt vom orbitalen Agrarturm. Der Boden-Extraktor holt ihn aus Fundstellen auf Gleba. Schaltet auch den Agrarturm frei. Unabhängig vom Geleenuss-Boden erforschbar.
ncs-jellynut-zone=Magentafarbener Bio-Boden für das Mutterschiff: Geleestrünke wachsen darauf, gepflanzt vom orbitalen Agrarturm. Der Boden-Extraktor holt ihn aus Fundstellen auf Gleba. Schaltet auch den Agrarturm frei. Unabhängig vom Yumako-Boden erforschbar.

